<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Interactivo - Introducción al Desarrollo de Software (Pág. 1-45)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .question-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background-color: #f1f5f9;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--primary);
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #results {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            text-align: center;
        }

        #results h2 {
            color: #166534;
            margin-top: 0;
        }

        .feedback-box {
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .feedback-correct {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .feedback-incorrect {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .back-link {
            display: block;
            color: red;
            text-decoration: none;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Evaluación del Módulo</h1>
    <div class="subtitle">Basado estrictamente en el documento oficial (Páginas 1 a 45): Ingeniería de Sistemas, Evolución del Computador y Almacenamiento.</div>
    <a href="index.html" class="back-link">VOLVER A LAS PRIMERAS PREGUNTAS</a>

    <form id="quizForm">
        <div id="questionsContainer"></div>

        <div class="btn-container">
            <button type="button" onclick="evaluateQuiz()">Calificar Examen</button>
        </div>
    </form>

    <div id="results">
        <h2>Resultados del Examen</h2>
        <p id="scoreText" style="font-size: 1.2rem; font-weight: bold;"></p>
        <p id="feedbackText"></p>
    </div>
</div>

            options: [
                "A) Se suman todos los valores de las potencias sin importar el dígito binario.",

        {
            question: "22. En el sistema numérico Hexadecimal (base 16), ¿cómo se representan los valores numéricos 10, 11 y 15 respectivamente?",
            options: [
                "A) J, K, Z",
                "B) A, B, F",
                "C) X, Y, W",
                "D) T, U, V"

        {

        {
            question: "24. ¿Qué diferencia fundamental existe entre la etapa de 'Codificación' y la 'Digitación' dentro del proceso lógico?",

        {

        {

        },
        {
            question: "30. Según las pistas de aprendizaje del documento sobre los juegos lógicos, ¿cómo deben ser vistos principalmente por el estudiante de desarrollo de software?",

    function loadQuiz() {
        const container = document.getElementById('questionsContainer');
        let htmlContent = '';

        questionsData.forEach((q, index) => {
            htmlContent += `
                <div class="question-card" id="card-${index}">
                    <div class="question-title">${q.question}</div>
                    <div class="options-list">
            `;

            q.options.forEach((opt, optIndex) => {
                htmlContent += `
                    <label class="option-label" id="label-${index}-${optIndex}">
                        <input type="radio" name="question-${index}" value="${optIndex}" onchange="handleOptionSelection(${index}, ${optIndex})">
                        <span>${opt}</span>
                    </label>
                `;
            });

            htmlContent += `
                    </div>
                    <div class="feedback-box" id="feedback-${index}"></div>
                </div>
            `;
        });

        container.innerHTML = htmlContent;
    }

    // Función que evalúa la pregunta inmediatamente y deshabilita sus opciones para que no se puedan cambiar
    function handleOptionSelection(qIndex, selectedOptIndex) {
        const q = questionsData[qIndex];
        const feedbackBox = document.getElementById(`feedback-${qIndex}`);
        
        // Bloquear todos los inputs de esta pregunta específica para que no se puedan cambiar
        const inputs = document.querySelectorAll(`input[name="question-${qIndex}"]`);
        inputs.forEach(input => {
            input.disabled = true;
        });

        const selectedLabel = document.getElementById(`label-${qIndex}-${selectedOptIndex}`);
        const correctLabel = document.getElementById(`label-${qIndex}-${q.correct}`);

        feedbackBox.style.display = 'block';

        if (selectedOptIndex === q.correct) {
            // Respuesta Correcta
            selectedLabel.style.backgroundColor = '#dcfce7';
            selectedLabel.style.borderColor = '#22c55e';
            
            feedbackBox.className = 'feedback-box feedback-correct';
            feedbackBox.innerHTML = `<strong>¡Correcto!</strong> Has seleccionado la respuesta adecuada.`;
        } else {
            // Respuesta Incorrecta
            selectedLabel.style.backgroundColor = '#fee2e2';
            selectedLabel.style.borderColor = '#ef4444';

            // Mostrar la correcta en verde suave
            correctLabel.style.backgroundColor = '#dcfce7';
            correctLabel.style.borderColor = '#22c55e';

            feedbackBox.className = 'feedback-box feedback-incorrect';
            feedbackBox.innerHTML = `<strong>Incorrecto.</strong> La opción correcta era la <strong>${String.fromCharCode(65 + q.correct)}</strong>.`;
        }
    }

    function evaluateQuiz() {
        let score = 0;

        questionsData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            if (selected && parseInt(selected.value) === q.correct) {
                score++;
            }
        });

        const resultsDiv = document.getElementById('results');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');

        resultsDiv.style.display = 'block';
        scoreText.innerText = `Puntuación: ${score} de ${questionsData.length} (${Math.round((score/questionsData.length)*100)}%)`;

        if (score === questionsData.length) {
            feedbackText.innerText = "¡Excelente! Dominas a la perfección los contenidos de las primeras 45 páginas.";
        } else if (score >= 22) {
            feedbackText.innerText = "¡Muy buen trabajo! Tienes claros los conceptos fundamentales del módulo.";
        } else if (score >= 15) {
            feedbackText.innerText = "Buen intento, pero te sugerimos repasar la lectura de las unidades 1 y 2 del documento.";
        } else {
            feedbackText.innerText = "Es recomendable realizar una lectura detallada de las páginas 1 a 45 para afianzar los conceptos.";
        }

        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = loadQuiz;
</script>

</body>
</html>
